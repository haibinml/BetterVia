apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.0"
    
    defaultConfig {
        applicationId "com.jiguro.bettervia"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 20260824
        versionName "2.2.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
	compileOnly fileTree(dir: 'libs/compile_only', include: ['*.jar'])
	implementation 'com.android.tools.build:apksig:4.2.0'
	// FastScroll 设置页自带的 RecyclerView：
	// LSPosed 类加载器隔离下无法复用宿主进程的 AndroidX 类，必须随模块打包（含传递依赖与资源）。
	implementation 'androidx.recyclerview:recyclerview:1.2.1'
}
